services:
  vllm:
    image: vllm/vllm-openai:latest
    command: >
      --model Md-Asif/VANGUARD-MODEL-V1
      --served-model-name Md-Asif/VANGUARD-MODEL-V1
      --port 8000
      --gpu-memory-utilization 0.86
      --max-model-len 2048
      --trust-remote-code
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HF_HUB_OFFLINE=1
    volumes:
      - /home/techpark3/.cache/huggingface:/root/.cache/huggingface
      - models_data:/data/models
    ports:
      - "8001:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
    restart: unless-stopped

